<article class="card h-100 border-0 shadow-sm producto">
  <button type="button" class="btn btn-sm favorito"><i class="bi bi-heart"></i></button>

  <div class="imagen">
    @if (producto().imagenUrl) {
      <img [src]="producto().imagenUrl" [alt]="producto().nombre" loading="lazy" />
    } @else {
      <span class="text-muted small">Sin imagen</span>
    }
  </div>

  <div class="card-body d-flex flex-column gap-1">
    <h3 class="h6 mb-0 text-truncate" [title]="producto().nombre">{{ producto().nombre }}</h3>
    @if (producto().descripcion) {
      <p class="small text-muted mb-0 descripcion">{{ producto().descripcion }}</p>
    }
    <p class="fw-bold fs-5 mb-0">{{ producto().precio | currency: 'COP' : 'symbol-narrow' : '1.0-0' }}</p>
    <p class="small mb-2" [class]="estado().clase">{{ estado().texto }}</p>
    <button type="button" class="btn btn-primary w-100 mt-auto">Ver producto</button>
  </div>
</article>
