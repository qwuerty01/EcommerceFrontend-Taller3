<main class="fondo-auth d-flex align-items-center justify-content-center p-3">
  <div class="tarjeta-auth card border-0 shadow overflow-hidden">
    <div class="row g-0">
      <div class="col-md-6 marca-auth d-none d-md-flex flex-column align-items-center justify-content-center p-5 text-center">
        <a routerLink="/" class="logo-auth text-decoration-none"><i class="bi bi-cart3 text-primary"></i> ShopEasy</a>
        <p class="text-secondary mt-2">Tu tienda, en un solo lugar.</p>
        <img class="ilustracion-auth mt-4" src="bolsas.svg" alt="" />
      </div>

      <div class="col-md-6 bg-white p-4 p-md-5">
        <h1 class="h2 fw-bold mb-1 titulo-auth">Crear cuenta</h1>
        <p class="text-secondary mb-4">Completa la información para registrarte</p>

        <form (submit)="$event.preventDefault()">
          <div class="mb-3">
            <label class="form-label fw-semibold" for="nombre">Nombre completo</label>
            <input id="nombre" type="text" class="form-control" placeholder="Tu nombre completo" />
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold" for="correo">Correo electrónico</label>
            <input id="correo" type="email" class="form-control" placeholder="tu@email.com" />
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold" for="password">Contraseña</label>
            <input id="password" type="password" class="form-control" placeholder="Mín. 6 caracteres" />
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold" for="confirmar">Confirmar contraseña</label>
            <input id="confirmar" type="password" class="form-control" placeholder="Repite la contraseña" />
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2">Registrarse</button>
        </form>

        <p class="text-center text-secondary mt-4 mb-0">
          ¿Ya tienes una cuenta? <a routerLink="/login" class="fw-semibold text-decoration-none">Inicia sesión</a>
        </p>
      </div>
    </div>
  </div>
</main>
